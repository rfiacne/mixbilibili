name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-analyzer is what deslop-please drives to index the workspace.
          components: clippy, rustfmt, rust-analyzer

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Run clippy
        if: runner.os == 'Linux'
        run: cargo clippy -- -D warnings

      - name: Install deslop-please
        if: runner.os == 'Linux'
        env:
          DESLOP_VERSION: v0.1.6
        run: |
          # Prebuilt musl binary: `cargo install` would pull rust-analyzer and
          # take minutes. The version is pinned so a new release cannot turn
          # this check red without a lockstep bump here.
          name="deslop-please-x86_64-unknown-linux-musl-${DESLOP_VERSION}"
          base="https://github.com/deterministic-machines/deslop-please/releases/download/${DESLOP_VERSION}"
          mkdir -p "$HOME/.local/bin" /tmp/deslop
          # The published .sha256 names the archive, so keep that exact file name.
          curl -fsSL "${base}/${name}.tar.gz" -o "/tmp/deslop/${name}.tar.gz"
          curl -fsSL "${base}/${name}.tar.gz.sha256" -o "/tmp/deslop/${name}.tar.gz.sha256"
          cd /tmp/deslop && sha256sum -c "${name}.tar.gz.sha256"
          tar -xzf "/tmp/deslop/${name}.tar.gz" -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/deslop-please"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run deslop-please
        if: runner.os == 'Linux'
        run: deslop-please

      - name: Run tests
        run: cargo test

  msrv:
    # The declared `rust-version` has to be proven, not asserted: without this
    # job a dependency can quietly raise the floor, as `home 0.5.12` did to 1.88.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Build on the declared minimum
        run: cargo build --locked --all-targets

  release-profile:
    # The release profile (opt-level="z", fat LTO, codegen-units=1, panic="abort")
    # compiles differently enough from the debug profile that "tests pass" does
    # not imply "the shipped binary builds". One native build per push keeps that
    # honest without paying for the whole matrix; the cross targets follow below.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build with the release profile
        run: cargo build --release --locked

  build:
    # Packaging is a release concern: the cross targets and the archives only
    # matter when a version is being shipped. A tag still builds, tests and
    # packages everything, so nothing reaches a release unbuilt.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, release-profile]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mixbilibili
            ext: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: mixbilibili
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mixbilibili.exe
            ext: ".exe"
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Binary size report
        shell: bash
        run: |
          SIZE=$(du -h target/${{ matrix.target }}/release/${{ matrix.bin }} | cut -f1)
          echo "Binary: ${{ matrix.bin }} — Size: $SIZE"
          echo "## Binary Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.target }} | ${{ matrix.bin }} | $SIZE |" >> $GITHUB_STEP_SUMMARY

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          # On a pull_request event GITHUB_REF_NAME is "<pr>/merge", and a slash
          # both nests the archive directory and breaks `tar -czf dist/...`:
          # only tags carry a version worth naming.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev"
          fi
          ARCHIVE_NAME="mixbilibili-${VERSION}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} "${ARCHIVE_NAME}/"

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czf "dist/${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          fi
          rm -rf "${ARCHIVE_NAME}"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME } else { "dev" }
          $target = "${{ matrix.target }}"
          $archiveName = "mixbilibili-$version-$target"
          New-Item -ItemType Directory -Force -Path $archiveName | Out-Null
          Copy-Item "target/$target/release/${{ matrix.bin }}" $archiveName
          Compress-Archive -Path $archiveName -DestinationPath "dist/$archiveName.zip"
          Remove-Item -Recurse -Force $archiveName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \\[${VERSION}\\]/{p=1;next}/^## \\[/{p=0}p" CHANGELOG.md)
            if [ -n "$NOTES" ]; then
              echo "notes<<NOTES_EOF" >> $GITHUB_OUTPUT
              echo "$NOTES" >> $GITHUB_OUTPUT
              echo "NOTES_EOF" >> $GITHUB_OUTPUT
            else
              echo "notes=No changelog entries found for version ${VERSION}" >> $GITHUB_OUTPUT
            fi
          else
            echo "notes=CHANGELOG.md not found" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: mixbilibili-*
          body: ${{ steps.changelog.outputs.notes }}
